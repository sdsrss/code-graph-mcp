# Copy this file into .github/workflows/ in your project to publish a
# code-graph snapshot alongside each GitHub release. The snapshot is a
# small (~3-5MB) zstd-compressed SQLite database that lets first-time
# clones of your repo skip the initial full code-graph index.
#
# Requires: @sdsrs/code-graph >= 0.23.0 published to npm.
#
# The package name is `@sdsrs/code-graph` (the `code-graph-mcp` binary lives
# inside it). Do NOT shorten this to `npx -y code-graph-mcp` — that unscoped
# name belongs to an unrelated publisher on npm, and `npx -y` would install and
# execute their package in your CI with whatever permissions this job holds.
# Bump the pinned version below when you want a newer snapshot format.

name: Code Graph Snapshot
on:
  release:
    types: [published]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # SHA-pinned, not `@v4`: a floating major tag is mutable, so anyone who can
      # move it runs their code in a job that holds `contents: write` on your
      # repo. These are the same commits code-graph-mcp's own workflows pin.
      # Update by copying a new SHA from the action's release page, not by
      # switching back to a tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Build snapshot
        run: |
          npx -y -p @sdsrs/code-graph@0.126.2 code-graph-mcp snapshot create --out snapshot.db
          zstd -9 snapshot.db -o snapshot.db.zst
          mv snapshot.db.zst "code-graph-snapshot-${GITHUB_SHA:0:7}.db.zst"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "code-graph-snapshot-${GITHUB_SHA:0:7}.db.zst"
