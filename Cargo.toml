[package]
name = "code-graph-mcp"
version = "0.125.0"
edition = "2021"
license = "MIT"
# No `rust-version` is declared, deliberately. The obvious candidate is CI's
# pinned toolchain (1.95.0), but that is a CHOSEN toolchain, not this crate's
# minimum: it compiles on 1.91.1 today, which declaring 1.95.0 would have
# locked out — attempting it turned `cargo check` into an immediate hard error
# here (2026-08-16 audit §四). Establishing the real floor means bisecting
# toolchains, and a floor guessed too high excludes users for nothing. The
# README states the situation instead of a number nobody measured.

# Local `cargo clippy` was less strict than CI, which runs
# `-D warnings`: drift landed in a working tree and only reddened on push.
# Declaring the level here means the same bar applies to every invocation,
# including an editor's rust-analyzer.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[features]
# v0.18.4: default flipped to [] for direct `cargo install` users — gives a
# small (~10 MB) FTS5-only binary without the ~120 MB candle/tokenizers stack.
# Opt in to embedding via `cargo install code-graph-mcp --features embed-model`.
# npm releases still ship with embed-model (release.yml builds with the flag),
# so npm/npx/plugin users see no behavior change. Embedding model files are
# downloaded by a background thread at server startup (run_startup_tasks ->
# start_post_index_services -> spawn_model_download), not gated on a tool call;
# embedding then self-drives via spawn_background_embedding/run_unembedded_backfill.
# Until the download finishes, load() returns Ok(None) gracefully (files missing)
# and search degrades to FTS5-only.
default = []
embed-model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers",
               "dep:tokenizers", "dep:ureq", "dep:flate2", "dep:tar", "dep:dirs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled-full"] }
libsqlite3-sys = { version = "0.36", features = ["bundled"] }  # direct dep needed for DEP_SQLITE3_INCLUDE in build.rs
blake3 = "1"
ignore = "0.4"
rayon = "1"
notify = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
bytemuck = "1"
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
# platform-verifier: fall back to the OS certificate store when the bundled
# webpki roots reject the release host (corporate TLS inspection — issue #35).
ureq = { version = "3", features = ["platform-verifier"], optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
dirs = { version = "6", optional = true }
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.23.11"
tree-sitter-swift = "0.6.0"
tree-sitter-dart-orchard = "0.3.2"
tree-sitter-md = "0.3"
tree-sitter-bash = "0.23.3"
tree-sitter-json = "0.24.8"
tempfile = "3"

[build-dependencies]
cc = "1"
# Supply-chain pin: build.rs verifies the vendored sqlite-vec C against pinned
# blake3 hashes. blake3 is already a runtime dep (same crate, host-compiled here).
blake3 = "1"

[profile.release]
opt-level = 2
lto = true
strip = true
codegen-units = 1
# NOTE: do NOT set `panic = "abort"` here. The serve loop's per-request
# `std::panic::catch_unwind` (src/main.rs:500) turns a handler panic into a
# JSON-RPC -32603 and keeps the long-lived stdio session alive; `abort` tears
# the whole process down before that catch can run, making the defense inert in
# the shipped release binary (tests run under the dev/unwind profile, so an
# abort setting would be false-green there). Default panic strategy = unwind.

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "indexing"
harness = false
