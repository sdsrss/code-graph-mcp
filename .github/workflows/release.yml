name: Release

on:
  push:
    tags: ['v*']
  # Manual re-run of a failed release on an existing tag. Use when publish
  # broke (NPM_TOKEN expired, transient registry 5xx, etc.) and you don't
  # want to bump a new version just to re-trigger the pipeline. Dispatch from
  # the default branch; each job checks out `inputs.tag` instead of the
  # default-branch HEAD so the build/publish matches that tag's source.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to (re-)release, e.g. v0.32.2. Must already exist on origin.'
        required: true
        type: string

permissions:
  contents: write

# Serialize releases for the same ref so a tag-push run and a workflow_dispatch
# re-run on the same tag don't race (both build + publish the same version).
# cancel-in-progress: false — never abort an in-flight publish half-way.
#
# This was the ONE site in the file with no `inputs.tag` fallback: a dispatch
# runs from the default branch, so bare `github.ref` was `refs/heads/main` while
# the tag-push run for the same version was `refs/tags/vX.Y.Z` — two group keys,
# no serialization, both runs publishing the same version.
#
# The fallback has to REBUILD the ref, not substitute the raw input. A
# concurrency group is compared as a literal string, so the plain
# `inputs.tag || github.ref` used everywhere else in this file yields
# `release-v0.109.0` for the dispatch and `release-refs/tags/v0.109.0` for the
# push — still two keys, still no serialization. The other six sites are correct
# with the plain form because they feed `ref:` / `tag_name:`, where `v0.109.0`
# and `refs/tags/v0.109.0` resolve to the same object; only here does the
# spelling itself matter.
concurrency:
  group: release-${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  # Quality gate (audit 2026-07-27 P1-3): before this job, a tag push reached
  # npm without ever running fmt, clippy, or a single Rust test. release.yml's
  # only trigger is `tags: ['v*']` and its job chain was build → publish →
  # smoke, with no `needs: ci` and no `workflow_run` anywhere — and
  # bump-version.sh instructs `git push && git push --tags` with no wait between
  # them, so ci.yml's verdict on the commit does not exist yet when the tag
  # fires. The 07-24 audit found clippy RED on already-committed code; under the
  # old topology that state published to npm, which is irreversible.
  #
  # publish's existing gates (artifact `--version` == tag, full JS suite) are
  # real but cover zero Rust.
  gate:
    name: Gate (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          # Same redirect as `build` below: on workflow_dispatch, github.ref is
          # main, and gating main's HEAD would certify code the tag doesn't
          # contain. Sixth site of the inputs.tag fallback contract.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # Restore-only, and only from the cache cache-warm.yml's `warm-gate` job
      # writes on main. Two properties drive this:
      #   - `shared-key` (not `key`): rust-cache's automatic key embeds the JOB
      #     name, so a plain `key` from a differently-named job never matches.
      #     Same lesson as `build` below, proven live on v0.101.0.
      #   - `save-if: false`: Actions caches are ref-scoped, so anything this job
      #     saved under refs/tags/vX would be invisible to the NEXT tag while
      #     still consuming the repo's 10 GB LRU budget — pure eviction pressure
      #     on entries that are readable. Only the main-branch warm job writes.
      # If warm-gate has not run recently the restore simply misses and this job
      # compiles cold (~5-9 min), which is what it did before caching existed.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-gate
          save-if: false

      # The 43 ripgrep-backed tests in tests/cli_e2e.rs are each guarded by
      # `if !has_ripgrep() { … return; }`, and no runner ships `rg` — so the
      # `cargo test` step below certified the entire `code-graph-mcp grep`
      # surface without executing one of its tests (audit 2026-08-02). This is
      # the last check before an irreversible npm publish, so a silently empty
      # test class is exactly what it must not have. Mirrored in cache-warm.yml
      # `warm-gate`, which installs ripgrep for the same reason.
      - name: Install ripgrep (cli_e2e grep tests self-skip without it)
        timeout-minutes: 8
        run: |
          # The short-circuit alone did NOT keep an apt hiccup off this path, as
          # an earlier version of this comment claimed it would: no runner ships
          # ripgrep (see ci.yml's note), so on Linux the check always falls
          # through to apt, and on 2026-08-19 this gate sat 29 minutes on a
          # stalled mirror before being killed by hand — with the v0.122.0 tag
          # already pushed and nothing published, since every later job needs
          # this one. The bound and the retry are what actually keep it off the
          # critical path; the check only helps a runner that has `rg` already.
          if command -v rg >/dev/null 2>&1; then rg --version; exit 0; fi
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y ripgrep; then
              rg --version
              exit 0
            fi
            echo "::warning::ripgrep install attempt ${attempt} failed or timed out; retrying"
            sleep 5
          done
          echo "::error::apt could not install ripgrep after 3 attempts"
          exit 1

      # ci.yml has this same assertion, but ci.yml never runs on a tag — and the
      # mode reverted invisibly once already in the batch that added it (a
      # `git stash` round-trip under `core.fileMode=false`). Without it here, a
      # reverted exec bit publishes silently with the local commit gate inert.
      - name: Commit-gate scripts must be executable in the git index
        run: |
          status=0
          for f in scripts/githooks/pre-commit scripts/pre-commit.sh; do
            mode=$(git ls-files -s -- "$f" | cut -d' ' -f1)
            if [ -z "$mode" ]; then
              echo "::error file=$f::not tracked by git — update this check if the hook moved"
              status=1
            elif [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode is $mode in the git index; git ignores non-executable hooks, so the commit gate does nothing on a fresh clone. Fix: git update-index --chmod=+x $f"
              status=1
            fi
          done
          exit $status

      - name: Check formatting
        run: cargo fmt --check

      # Both feature sets, in this order: the no-default pass is cheap (no
      # candle) and fails fast, and its compiled deps are reused by the second.
      # embed-model is what release binaries ship, so gating only the default
      # set would leave the shipped configuration unchecked.
      - name: Clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: Clippy (embed-model)
        run: cargo clippy --locked --features embed-model --all-targets -- -D warnings

      # ── Test coverage of this gate vs ci.yml (audit 2026-08-16 P1-18) ────────
      # ci.yml runs `cargo test --no-default-features` on ubuntu + macos +
      # windows AND `cargo test --features embed-model` on ubuntu. This gate ran
      # only the embed-model leg, so BOTH axes were narrower than the branch CI
      # that never fires on a tag:
      #
      #   - FEATURE axis (fixed below): `default = []` is what `cargo install`
      #     users compile, and a regression reachable only in the FTS5-only
      #     build — a `#[cfg(not(feature = "embed-model"))]` arm, a fallback that
      #     only exists when vector search is absent — passed the last check
      #     before an irreversible npm publish. The two steps below close it.
      #
      #   - OS axis (accepted, NOT fixed): macOS and Windows legs are
      #     deliberately not added here. OS-specific regressions are caught by
      #     ci.yml on the commit and, post-publish, by the three-OS smoke-verify
      #     job below; the gate intentionally trades OS breadth for tag latency,
      #     since adding two more cold (uncached) runners to the critical path
      #     delays every release for a class of failure two other gates already
      #     observe. Revisit if a Windows/macOS-only break ever reaches npm.
      - name: Test (no default features)
        # First, and without the embed feature: no candle to compile, so this
        # fails fast, and its compiled deps are reused by the embed-model run
        # below. Same cheap-first ordering as the clippy pair above.
        #
        # Cache note: cache-warm.yml's `warm-gate` runs this same command so the
        # no-default test/bin targets restore warm from the `release-gate` cache
        # (the two files' command sets are pinned together by
        # tests/hardening.rs::release_and_cache_warm_workflows_do_not_drift).
        run: cargo test --locked --no-default-features

      - name: Test (embed-model)
        # Mirrors ci.yml's embed-check job: without this the spawned `serve`
        # integration tests background-fetch the ~90 MB model on a runner whose
        # cache does not carry it — slow, and flaky because cache population
        # flips which tests self-skip. This job is now the last gate before an
        # irreversible npm publish, so it must not be the flakiest one.
        env:
          CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: '1'
        run: cargo test --locked --features embed-model

      - name: Real-weight embedding gate
        # ENG-02 (audit 2026-09-05). Every embedding test in this repo self-skips
        # when no model is loadable, and EVERY leg that compiles them (ci.yml
        # embed-check, cache-warm, and the step directly above) sets
        # CODE_GRAPH_DISABLE_MODEL_DOWNLOAD=1 on a runner with no cached model.
        # They reported green having executed nothing, so the first real-weight
        # check in the entire pipeline was `smoke-verify` — which declares
        # `needs: publish`, i.e. AFTER the irreversible npm publish.
        #
        # What runs here is the CHEAP half: load the weights we are about to ship
        # and embed one string (1.36 s measured). CODE_GRAPH_REQUIRE_MODEL=1 turns
        # its absent-weights no-op into a failure, so it cannot pass by doing
        # nothing.
        #
        # The THOROUGH half — mcp_startup_embeds_without_any_tool_call and
        # mcp_periodic_backfill_embeds_out_of_band_nodes, which observe backfill
        # end to end — is deliberately NOT here, because they fail intermittently
        # and nobody yet knows why: 2 runs in 6 against real weights, both of them
        # `0 vectors after 300 s` from the startup test, which passes in 51 s when
        # run alone.
        #
        # It is NOT slowness, and the earlier version of this comment said it was.
        # EMBED_POLL_BUDGET is per test, not per pair, and each test finished well
        # inside it even pinned to 2 cores; the 424 s wall time of a failing run is
        # 300 s of the poll loop finding nothing plus setup and teardown, i.e. the
        # same zero-vector failure rather than a timing one. The weights and an
        # unread stderr pipe were also measured and ruled out.
        #
        # An unexplained 2-in-6 in front of an irreversible publish is a coin flip
        # that blocks every release, so those two run on the cache-warm cron
        # instead, where a red run is a finding (pre-ship review 2026-09-06).
        #
        # Weights come from the same sha256-pinned `model-assets-v1` mirror the
        # publish job packages (see "Package model files"), so this step adds no
        # third-party dependency to the critical path. CODE_GRAPH_MODEL_DIR is the
        # loader's highest-priority location, so DISABLE_MODEL_DOWNLOAD stays on:
        # nothing is downloaded here at all. Naming HuggingFace would name the
        # wrong risk — the auto-download targets this repo's own release, not HF
        # (src/embedding/model.rs). What actually holds it shut is
        # `spawn_model_download` returning early once a model is loaded
        # (mcp/server/mod.rs:1280-1282) and DISABLE_MODEL_DOWNLOAD short-circuiting
        # before any thread spawns (:1291-1300).
        #
        # It compiles nothing the gate did not already compile, which is why it
        # needs no `warm-gate` twin the way the `run: cargo` steps above do.
        # Bounds a wedged download or a hung load: this sits in front of an
        # irreversible publish, so a fast attributed red beats burning the job's
        # 30-minute cap. Same hygiene as the ripgrep step above. Measured green
        # path is well under a minute (1.36 s of test plus the fetch).
        timeout-minutes: 10
        env:
          CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: '1'
          CODE_GRAPH_REQUIRE_MODEL: '1'
        run: |
          mkdir -p gate-models
          MODEL_BASE="https://github.com/${{ github.repository }}/releases/download/model-assets-v1"
          for f in model.safetensors tokenizer.json config.json; do
            # --max-time: curl has NO default transfer timeout and --retry does
            # not fire on a connected-but-stalled transfer. This file already
            # records what that costs on the critical path — the ripgrep step
            # above sat 29 minutes on a stalled mirror with the tag pushed and
            # nothing published (2026-08-19), which is why it carries `timeout`.
            curl -L --fail --retry 3 --retry-delay 2 --max-time 300 -o gate-models/$f \
              "$MODEL_BASE/$f"
          done
          # Same three pins as "Package model files"; kept in sync by
          # tests/hardening.rs::release_model_pins_agree_across_jobs.
          sha256sum -c - <<'PINS'
          53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db  gate-models/model.safetensors
          be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  gate-models/tokenizer.json
          953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41  gate-models/config.json
          PINS
          export CODE_GRAPH_MODEL_DIR="$PWD/gate-models"
          # Named EXACTLY, and the count asserted afterwards, because
          # `cargo test <substring>` exits 0 when the filter matches NOTHING —
          # measured: "0 passed … EXIT=0". A rename, an `#[ignore]`, or a move to
          # another test target would put this step straight back into the state
          # it exists to end: green, having executed nothing, with
          # CODE_GRAPH_REQUIRE_MODEL powerless because its assert lives inside a
          # test that never runs. The name is also pinned to the source by
          # tests/hardening.rs::release_gate_runs_the_real_weight_tests_by_name,
          # so a rename fails a local `cargo test` before it can reach a tag.
          cargo test --locked --features embed-model --lib -- \
            --exact embedding::model::tests::test_embed_produces_correct_dims \
            --test-threads=1 > gate-embed.log 2>&1 || { cat gate-embed.log; exit 1; }
          cat gate-embed.log
          grep -qE '^test result: ok\. 1 passed' gate-embed.log || {
            echo "::error::the real-weight embedding gate did not run its test — see the log above"
            exit 1
          }

  build:
    name: Build ${{ matrix.npm-pkg }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: linux-x64
            binary: code-graph-mcp
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm-pkg: linux-arm64
            binary: code-graph-mcp
          - target: x86_64-apple-darwin
            os: macos-latest
            npm-pkg: darwin-x64
            binary: code-graph-mcp
          - target: aarch64-apple-darwin
            os: macos-latest
            npm-pkg: darwin-arm64
            binary: code-graph-mcp
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm-pkg: win32-x64
            binary: code-graph-mcp.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
          # Push trigger: github.ref = refs/tags/vX.Y.Z, checkout is a no-op.
          # workflow_dispatch trigger: github.ref = main, must redirect to the
          # tag the operator specified, otherwise we'd build main's HEAD under
          # an old version number.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # SHA-pinned for release-pipeline supply-chain integrity (cso #1, #3):
      # @stable was auto-resolving to whatever rustc was current at build time —
      # binary published to npm was built with a Rust version CI never tested,
      # and a moved tag would silently affect every release. Pinned to the same
      # 1.95.0 branch CI uses (ci.yml: dtolnay/rust-toolchain@1.95.0).
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # `shared-key` (NOT `key`): rust-cache's automatic key embeds the JOB name,
      # so plain `key` never matches across workflows — cache-warm.yml's `warm`
      # job and this `build` job hashed to different caches and v0.101.0 still
      # built cold ("No cache found" on all 5 targets) despite a green priming
      # run. shared-key replaces the job-bound portion, making the main-branch
      # warm cache restorable here. Must stay identical in cache-warm.yml.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # Bounded like every other apt call here: this one sits on the release
      # critical path, where an unbounded stall costs a hand-killed run with the
      # tag already pushed.
      #
      # The bound is the STEP timeout only — no inner `timeout` per command. The
      # first version of this hardening wrapped both commands in `timeout 120`,
      # copying the budget from the ripgrep step, and killed the v0.122.1 arm64
      # build with exit 124: ripgrep is ~2 MB while this pulls a ~45 MB cross
      # toolchain, and the mirror was serving it fine, just not in two minutes.
      # An inner timeout only earns its place inside a retry loop bounding each
      # attempt — so v0.133.0 added the retry rather than keep removing the
      # timeout. On 2026-09-04 this step's TWIN in cache-warm.yml, byte-identical
      # and running from the same push, died on the bare 15-minute ceiling with
      # the mirror still feeding it (21 MB of `gcc-13-aarch64-linux-gnu` arrived
      # over seven minutes, then the step was killed mid-download) while this
      # copy passed. Nothing distinguished them but which mirror each runner drew
      # from `/etc/apt/apt-mirrors.txt`, which is picked per invocation — so a
      # fresh attempt is a fresh draw, and that is the only thing a retry buys
      # here. It matters more on this side than on the warm side: cache-warm
      # failing costs a cold build, this failing sits one job above an
      # irreversible npm publish.
      #
      # Budget per the v0.122.1 lesson that a timeout must be sized to what it
      # guards: a healthy mirror serves all 45 MB in well under a minute, so
      # seven minutes is already the pathological case and three draws fit under
      # the step ceiling with room for dpkg.
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 24
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 420 apt-get update && \
               sudo timeout 420 apt-get install -y gcc-aarch64-linux-gnu; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt did not deliver the aarch64 toolchain in 3 attempts of 7 minutes"
              exit 1
            fi
            # A kill mid-unpack can leave dpkg half-configured; the next attempt
            # would then fail on that rather than on the mirror, which is a
            # confusing second failure with a different cause.
            sudo dpkg --configure -a || true
            echo "::warning::apt attempt $attempt did not finish in 7 minutes; retrying against a fresh mirror draw"
            sleep 15
          done
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      # `--features embed-model` keeps npm/npx/plugin users on the full hybrid
      # stack (FTS5 + vector). Cargo default flipped to [] in v0.18.4 to give
      # `cargo install` users a smaller binary; npm release explicitly opts
      # back in here so the user-visible npm contract is unchanged.
      - name: Build
        run: cargo build --locked --release --features embed-model --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.npm-pkg }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # `id-token: write` is what `npm publish --provenance` mints its attestation
    # with; without it the publish step FAILS rather than degrading, so the flag
    # and this permission are one change and must never be split (2026-08-16
    # audit §四). Job-scoped, not workflow-scoped: nothing else here needs to
    # mint tokens.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/

      - name: Set version from tag
        # On push trigger GITHUB_REF_NAME = "vX.Y.Z". On workflow_dispatch from
        # main, GITHUB_REF_NAME = "main" — fall back to inputs.tag instead.
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=${REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp artifacts/binary-$pkg/code-graph-mcp npm/$pkg/
            chmod +x npm/$pkg/code-graph-mcp
          done
          cp artifacts/binary-win32-x64/code-graph-mcp.exe npm/win32-x64/

      - name: Assert built binary version matches tag
        # Pre-publish drift gate (audit 2026-07-24 F1): the build job compiles
        # from the tag checkout BEFORE sync-versions rewrites anything, so a tag
        # cut with a lagging Cargo.toml (partial bump) ships a binary that
        # reports the OLD version — and until this step the only catch was
        # smoke-verify, which runs AFTER the packages are public. Exec one
        # artifact and diff against the tag while nothing has been published.
        run: |
          chmod +x artifacts/binary-linux-x64/code-graph-mcp
          actual=$(artifacts/binary-linux-x64/code-graph-mcp --version)
          expected="code-graph-mcp ${VERSION}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::built binary reports '$actual' but tag says '$expected' — Cargo.toml lagged the tag (partial bump). Fix versions and re-cut the tag; nothing was published."
            exit 1
          fi
          echo "OK: $actual"

      - name: Update versions
        # SYNC_VERSIONS_SKIP_BUILD: the Publish job already has the 5 pre-built
        # platform binaries (matrix artifacts); sync-versions.js's local
        # "rebuild release binary" convenience is pointless here and made the
        # release fragile — a transient crates.io blip (v0.65.0: `download of
        # float8 failed`) failed the whole publish at the rebuild, after all
        # binaries were built. Downstream steps use artifacts/ + npm/, never
        # target/release/, so skipping the rebuild is safe.
        run: node scripts/sync-versions.js $VERSION
        env:
          SYNC_VERSIONS_SKIP_BUILD: '1'

      - name: JS test suite (full — includes install-e2e)
        # Broadened from release-smoke only (which the glob still includes):
        # the local pre-commit hook was the ONLY gate running install-e2e.test.js
        # (ci.yml excludes it — needs a built binary), and that hook exists only
        # after `npm install` runs the prepare script, which a pure-Rust checkout
        # never does — v0.104.0 shipped with a red §1.9 because neither gate
        # fired. Here the binaries are already built, so feed find-binary's dev
        # path (target/release/) the linux-x64 artifact and run the whole suite.
        # mcp-launcher.test.js is included (audit 2026-07-24 F2): its old
        # exclusion reason (dedup test needing the gitignored dev .mcp.json) was
        # fixed when that test became self-contained, and with the artifact in
        # target/release/ even the binary-forwarding test runs for real here —
        # the stub→binary handover gets release-gate coverage.
        # --test-concurrency=1: same find-binary cache/env cross-process race as
        # documented in ci.yml.
        run: |
          mkdir -p target/release
          cp artifacts/binary-linux-x64/code-graph-mcp target/release/
          chmod +x target/release/code-graph-mcp
          # `find`, not a `*.test.js` shell glob — the glob is NON-RECURSIVE,
          # so the first test file anyone puts in a subdirectory is skipped in
          # silence. ci.yml and pre-commit were converted; this one is the LAST
          # gate before an irreversible `npm publish`, which is the one place
          # a silently-skipped test costs the most.
          # NOTE the difference from ci.yml: no install-e2e exclusion. The
          # glob this replaces matched `scripts/*.test.js`, which INCLUDES
          # install-e2e.test.js — and the release job is exactly where an
          # install end-to-end test should run. Recursive discovery only; the
          # file set is otherwise identical to what the glob produced.
          files=$(find claude-plugin/scripts scripts -type f -name '*.test.js' | sort)
          node --test --test-concurrency=1 $files

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            cp artifacts/binary-$pkg/code-graph-mcp release-assets/code-graph-mcp-$pkg
          done
          cp artifacts/binary-win32-x64/code-graph-mcp.exe release-assets/code-graph-mcp-win32-x64.exe
          # Per-binary sha256 sidecar (mirrors models.tar.gz.sha256 below).
          # auto-update.js fetches <asset>.sha256 and verifies the downloaded
          # binary BEFORE chmod/exec; same-origin, so it guards transit/CDN
          # corruption + truncation, not a full release-asset swap.
          for asset in code-graph-mcp-linux-x64 code-graph-mcp-linux-arm64 code-graph-mcp-darwin-x64 code-graph-mcp-darwin-arm64 code-graph-mcp-win32-x64.exe; do
            sha256sum "release-assets/$asset" | cut -d' ' -f1 > "release-assets/$asset.sha256"
          done

      - name: Package model files
        # Model weights are mirrored as assets on this repo's own stable
        # `model-assets-v1` release — a byte-for-byte copy of
        # sentence-transformers/all-MiniLM-L6-v2 @ HF revision
        # c9745ed1d9f207416be6d2e6f8de32d1f16199bf — so the release pipeline
        # never depends on a live HuggingFace download at publish time. HF
        # migrated this model to Xet storage, whose anonymous CDN fetch started
        # returning 403 AccessDenied and broke v0.96.0's first publish; a
        # GitHub-hosted mirror removes that third-party dependency entirely
        # (GitHub runners always reach GitHub). --fail makes curl exit non-zero
        # on HTTP 4xx/5xx so an error page can't masquerade as model.safetensors.
        # The content pins below verify the downloaded bytes against known-good
        # hashes, so a swapped or corrupted mirror asset fails the release
        # instead of shipping different weights. To change the model: re-cut the
        # `model-assets-v1` release assets, recompute all three sha256s here, AND
        # bump MODEL_CONTENT_BLAKE3 in src/embedding/model.rs (the client-side
        # verifier) in the same commit — clients reject any models.tar.gz whose
        # model.safetensors doesn't match that constant.
        run: |
          mkdir -p models-pkg
          MODEL_BASE="https://github.com/${{ github.repository }}/releases/download/model-assets-v1"
          for f in model.safetensors tokenizer.json config.json; do
            # --retry: a transient GitHub 5xx must not fail the release. Combined
            # with the publish-after-assets ordering below, a fetch blip fails
            # BEFORE npm publish (no half-release shipping a version whose
            # models.tar.gz 404s → FTS5-only).
            curl -L --fail --retry 3 --retry-delay 2 -o models-pkg/$f \
              "$MODEL_BASE/$f"
          done
          sha256sum -c - <<'PINS'
          53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db  models-pkg/model.safetensors
          be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  models-pkg/tokenizer.json
          953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41  models-pkg/config.json
          PINS
          tar czf release-assets/models.tar.gz -C models-pkg .
          sha256sum release-assets/models.tar.gz | cut -d' ' -f1 > release-assets/models.tar.gz.sha256

      - name: Package plugin files
        # The auto-updater used to install the plugin from GitHub's
        # auto-generated source `tarball_url`, which has NO published checksum:
        # the one download chain of four with zero integrity verification, and
        # the only one whose payload is JavaScript that then runs on the user's
        # machine (audit 2026-07-27 P2-23). Shipping the plugin tree as a real
        # release asset gives it the same `.sha256` sidecar the five binaries and
        # models.tar.gz already carry, so the client can fail CLOSED instead of
        # extracting and executing unverified JS.
        #
        # No --strip-components on the consumer side: this archives the
        # `claude-plugin/` directory itself, so extraction reproduces that exact
        # layout. The source tarball needed a strip because GitHub wraps it in a
        # `<owner>-<repo>-<sha>/` directory.
        #
        # `--exclude='*.test.js'` matches package.json's `files` allowlist, which
        # already keeps the 31 test files out of the npm tarball. The old source
        # archive shipped them (so dropping them is no regression), but there is
        # no reason to copy test code into a plugin cache Claude Code executes
        # from.
        run: |
          tar czf release-assets/claude-plugin.tar.gz --exclude='*.test.js' claude-plugin
          sha256sum release-assets/claude-plugin.tar.gz | cut -d' ' -f1 \
            > release-assets/claude-plugin.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          generate_release_notes: true
          files: release-assets/*
          # On push.tags trigger github.ref_name = "vX.Y.Z" and softprops picks
          # it up implicitly. On workflow_dispatch from main, github.ref_name =
          # "main" — softprops then errors with "GitHub Releases requires a
          # tag". Explicit tag_name with the same inputs.tag fallback the rest
          # of the job uses keeps both triggers working.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

      # npm publish runs LAST — only after the binaries, model tarball, and the
      # GitHub Release are all built and uploaded. Previously publish ran before
      # "Package model files" + "Create GitHub Release", so a transient HF failure
      # (or a forgotten sha bump) shipped npm packages for a version whose
      # models.tar.gz release asset never existed → every user on that version
      # silently degraded to FTS5-only until the workflow was re-run. The
      # EPUBLISHCONFLICT skip keeps re-runs idempotent.
      - name: Publish platform packages
        run: |
          for pkg in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            cd npm/$pkg
            # Capture publish output so we can distinguish "already published"
            # (E403 / EPUBLISHCONFLICT — safe to skip on workflow re-run) from
            # auth / 404 / network failures (must fail the job). Old "|| echo
            # warning" swallowed everything and made smoke tests the only fail
            # signal — 15 min of red retries before anyone noticed in v0.30.0.
            # --provenance: a signed, verifiable link from this tarball back to
            # the workflow run and commit that built it. Standard hardening for a
            # package that ships NATIVE BINARIES, where "did this .node come from
            # that source?" is not answerable any other way. Requires the
            # `id-token: write` above; the failure mode if it is ever removed is
            # a loud publish failure, not a silent unsigned release.
            if ! out=$(npm publish --access public --provenance 2>&1); then
              if echo "$out" | grep -qE "EPUBLISHCONFLICT|cannot publish over the previously published versions|You cannot publish over"; then
                echo "::warning::$pkg already published at $VERSION — skipping"
              else
                echo "$out"
                echo "::error::$pkg publish failed (not 'already exists' — check NPM_TOKEN / registry)"
                exit 1
              fi
            else
              echo "$out"
            fi
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: |
          # --provenance, same as the platform packages above.
          if ! out=$(npm publish --access public --provenance 2>&1); then
            if echo "$out" | grep -qE "EPUBLISHCONFLICT|cannot publish over the previously published versions|You cannot publish over"; then
              echo "::warning::main package already published at $VERSION — skipping"
            else
              echo "$out"
              echo "::error::main package publish failed (not 'already exists' — check NPM_TOKEN / registry)"
              exit 1
            fi
          else
            echo "$out"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Post-publish verification: in a clean env on each OS, install the JUST-
  # PUBLISHED package from the npm registry and assert the binary runs and
  # reports the expected version. Catches:
  #   - missing platform-binary optionalDependency
  #   - find-binary.js OS/arch detection regressions
  #   - sync-versions drift (npm pkg version != Cargo.toml version)
  #   - npm registry propagation issues
  # Retries the install with backoff since npm's CDN can lag ~30-60s behind
  # the publish API.
  smoke-verify:
    name: Post-publish smoke (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Extract version from tag
        shell: bash
        run: |
          REF_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          echo "VERSION=${REF_NAME#v}" >> $GITHUB_ENV

      - name: Install published package (with retry for registry propagation)
        shell: bash
        run: |
          set -eu
          # Post-publish smoke races npm registry propagation in TWO independent ways,
          # neither caught by npm's exit code, both of which the retry must tolerate:
          #
          #  (1) MAIN-package metadata lag -> `npm install @sdsrs/code-graph@X` fails with
          #      `ETARGET / No matching version` because the CDN edge this runner hit has
          #      not listed version X in the packument yet (v0.82.1 ubuntu smoke). npm
          #      then CACHES that stale packument locally (~/.npm, Cache-Control max-age
          #      ~minutes), so a NAIVE retry re-reads the stale cache and keeps returning
          #      ETARGET for the whole window even after the edge propagates. Fix: every
          #      registry read below uses --prefer-online to force revalidation instead
          #      of serving the stale cached packument.
          #  (2) PLATFORM optionalDependency lag -> once the main package resolves,
          #      `npm install -g` still EXITS 0 while silently skipping an unresolved
          #      @sdsrs/code-graph-<os>-<arch> ("added 1 package" not 2), so the binary
          #      is missing after a "successful" install (v0.66.0 ubuntu smoke). Fix:
          #      gate success on the binary RESOLVING to the expected version, never on
          #      npm's exit code.
          expected="code-graph-mcp ${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            echo "Install attempt $attempt of 6..."
            if ! npm view --prefer-online "@sdsrs/code-graph@${VERSION}" version >/dev/null 2>&1; then
              echo "Main package @sdsrs/code-graph@${VERSION} not visible on registry yet (ETARGET) — metadata still propagating."
            else
              npm install -g --prefer-online "@sdsrs/code-graph@${VERSION}" || true
              if actual=$(code-graph-mcp --version 2>/dev/null) && [ "$actual" = "$expected" ]; then
                echo "Install + binary resolved on attempt $attempt: $actual"
                break
              fi
              echo "Main package resolved but binary not runnable (got '${actual:-<none>}', want '$expected') — platform optional-dep still propagating."
            fi
            if [ "$attempt" = "6" ]; then
              echo "::error::@sdsrs/code-graph@${VERSION} did not yield a working binary after 6 attempts (registry propagation exceeded retry window). Recover with: gh run rerun <run-id> --failed"
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Verify --version matches tag
        shell: bash
        run: |
          set -eu
          actual=$(code-graph-mcp --version)
          expected="code-graph-mcp ${VERSION}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::--version mismatch: got '$actual', expected '$expected'"
            exit 1
          fi
          echo "OK: $actual"

      - name: Verify --help runs
        run: code-graph-mcp --help

      - name: Verify a real subcommand runs on a minimal project
        shell: bash
        run: |
          set -eu
          tmpdir=$(mktemp -d)
          cd "$tmpdir"
          git init -q
          git config user.email ci@example.com
          git config user.name CI
          mkdir -p src
          cat > src/main.rs <<'EOF'
          fn hello() { println!("hi"); }
          fn main() { hello(); }
          EOF
          git add . && git commit -q -m init
          # map requires an index — build one first.
          code-graph-mcp incremental-index --quiet
          code-graph-mcp map --json > map.json
          test -s map.json
          # Use fs.readFileSync with a cwd-relative path so this works across
          # shells where `$tmpdir` from `mktemp -d` is a POSIX-style path
          # (`/tmp/tmp.XXXX` on Git Bash under Windows) that Node.js on
          # Windows can't resolve. `node -e require('/tmp/...')` fails there
          # because `/tmp/` doesn't exist in the Win32 filesystem view.
          node -e "const m = JSON.parse(require('fs').readFileSync('map.json','utf8')); if (!m || typeof m !== 'object') { console.error('map.json is not a valid JSON object'); process.exit(1); } console.log('map OK:', Object.keys(m).slice(0, 5));"

      - name: Verify embedding model loads & embeds (vector integrity gate)
        # The prior smoke proved the binary runs + indexes (FTS/AST) but NEVER that
        # the embedding model downloads/loads — so a release with a missing/corrupt/
        # unloadable models.tar.gz shipped green while every user silently degraded to
        # FTS5-only (no vector). This pulls the PUBLISHED model, checksum-verifies it,
        # points the binary at it, and asserts it actually loads + embeds
        # (search_mode=hybrid). Linux-only: the model is platform-independent, so one
        # load+embed is enough to catch a broken model release. Boundary: validates the
        # published tarball loads & produces vectors; the blake3 content pin is enforced
        # at build (model packaging step) and at runtime in the normal cache path.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          work=$(mktemp -d); cd "$work"
          base="https://github.com/sdsrss/code-graph-mcp/releases/download/v${VERSION}"
          curl -fL --retry 3 -o models.tar.gz "$base/models.tar.gz"
          curl -fL --retry 3 -o models.tar.gz.sha256 "$base/models.tar.gz.sha256"
          echo "$(cat models.tar.gz.sha256)  models.tar.gz" | sha256sum -c -
          mkdir -p models && tar xzf models.tar.gz -C models
          test -s models/model.safetensors
          export CODE_GRAPH_MODEL_DIR="$work/models"
          proj=$(mktemp -d); cd "$proj"
          git init -q; git config user.email ci@example.com; git config user.name CI
          mkdir -p src
          printf 'fn alpha() {}\nfn beta() { alpha(); }\nfn main() { beta(); }\n' > src/main.rs
          git add . && git commit -q -m init
          code-graph-mcp incremental-index   # loads model from CODE_GRAPH_MODEL_DIR + embeds
          code-graph-mcp health-check --json > hc.json
          node -e '
            const h = JSON.parse(require("fs").readFileSync("hc.json","utf8"));
            console.log("health-check:", JSON.stringify({search_mode:h.search_mode, embedding_progress:h.embedding_progress, model_available:h.model_available}));
            const [done,total] = (h.embedding_progress||"0/0").split("/").map(Number);
            if (h.search_mode !== "hybrid" || !(done>0)) {
              console.error("::error::vector INACTIVE after installing the published model (search_mode="+h.search_mode+", embedded="+done+"/"+total+") — a broken model release; users would be silently FTS5-only");
              process.exit(1);
            }
            console.log("OK: vector active — embedded "+done+"/"+total);
          '
