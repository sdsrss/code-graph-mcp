name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repo. Without an explicit block
# a workflow inherits the repository's DEFAULT token permissions, which on many
# repos is still read-write across the whole API — so a compromised action in
# any step would hold a write token it never needed. The other three workflows
# already declare one; these two were the gap (2026-08-16 audit §四).
permissions:
  contents: read

jobs:
  # Formatting gate (audit 2026-07-24 F3): fmt was never checked anywhere —
  # not in CI, not in pre-commit — so drift accumulated silently. Cheap
  # (no build), one runner.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

      # Audit 2026-07-27 P1-6: both commit-gate scripts were mode 100644 in the
      # git index. Git silently ignores a non-executable hook ("hook was ignored
      # because it's not set as executable") and the commit goes straight
      # through, so on every fresh clone the gate was inert. It looked healthy on
      # the author's box only because the WORKING TREE happened to carry rwx —
      # a bit that was never committed. ea0166d's claim that "any machine that
      # cuts a release has the gate active" was false for exactly this reason.
      # Checked here rather than in a Rust test because the index mode is a
      # property of the repository, not of the build.
      - name: Commit-gate scripts must be executable in the git index
        run: |
          status=0
          for f in scripts/githooks/pre-commit scripts/pre-commit.sh; do
            mode=$(git ls-files -s -- "$f" | cut -d' ' -f1)
            if [ -z "$mode" ]; then
              echo "::error file=$f::not tracked by git — update this check if the hook moved"
              status=1
            elif [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode is $mode in the git index; git ignores non-executable hooks, so this gate does nothing on a fresh clone. Fix: git update-index --chmod=+x $f"
              status=1
            fi
          done
          exit $status

  # Full matrix: 3 OSes × 2 feature combos.
  # Catches platform-specific issues (Windows path separators, macOS linker
  # differences, sqlite-vec C compilation variance) that used to ship silently
  # because CI only ran on ubuntu-latest while release.yml builds 5 platform
  # binaries. Toolchain is pinned for reproducibility (memory:
  # feedback_ship_baseline_and_flakes).
  check:
    name: Check & Test (${{ matrix.os }}, ${{ matrix.feature-label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Only the FTS5-only default here (Cargo.toml `default = []`). The previous
        # `""` ("with-embed") leg built the EMPTY default — feature-identical to
        # --no-default-features, so embed-model never actually compiled in CI. Real
        # embed coverage now lives in the dedicated `embed-check` job below.
        feature-flag: ["--no-default-features"]
        include:
          - feature-flag: "--no-default-features"
            feature-label: "no-embed"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      # `code-graph-mcp grep` shells out to `rg`, and every one of the 43
      # ripgrep-backed tests in tests/cli_e2e.rs is wrapped in
      # `if !has_ripgrep() { eprintln!("skipping: rg not installed"); return; }`.
      # No runner ships ripgrep, so the whole grep surface — argv normalization,
      # flag rejection, cwd anchoring, error passthrough — reported green on all
      # three OSes while running nothing (audit 2026-08-02). Installing it is what
      # makes those tests exist in CI.
      - name: Install ripgrep (cli_e2e grep tests self-skip without it)
        shell: bash
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "ripgrep already present: $(rg --version | head -1)"
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep ;;
            Windows) choco install ripgrep -y ;;
            *)       echo "::error::unhandled RUNNER_OS '$RUNNER_OS' — add its ripgrep install here"; exit 1 ;;
          esac
          rg --version

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.os }}-${{ matrix.feature-label }}

      # --all-targets so BENCHES compile. `cargo check` (lib+bins) and
      # `cargo test` (lib+bins+tests) both skip bench targets, so benches/
      # indexing.rs was never built by any CI job and could rot against an API
      # change without anything going red — the bench exists to catch indexing
      # regressions and was itself unguarded.
      - name: Check
        run: cargo check ${{ matrix.feature-flag }} --all-targets

      # --all-targets here too: without it clippy lints lib+bins only, so a
      # violation in tests/ or benches/ passes every PR and then reddens
      # release.yml's `gate` (which does pass --all-targets) AFTER the tag is
      # cut — the one place a lint failure costs a re-release.
      - name: Clippy
        run: cargo clippy ${{ matrix.feature-flag }} --all-targets -- -D warnings

      - name: Test
        run: cargo test ${{ matrix.feature-flag }}

      # Criterion `--test` runs each benchmark ONCE and fails on panic: a
      # runtime smoke, not a timing gate (shared runners are far too noisy to
      # assert wall-clock). Compiling is covered on every OS above; running it
      # once on Linux is what catches a bench that builds but panics on its own
      # fixture. Timing regressions remain uncaught by CI — see the perf note in
      # the audit report; that needs a dedicated runner, not this step.
      - name: Bench smoke (criterion --test)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench ${{ matrix.feature-flag }} --bench indexing -- --test

  # The shipped binary is built `--features embed-model` (release.yml), but the
  # matrix above only exercises the FTS5-only default — so a regression in the
  # Candle / embedding / vector-search path passed CI and was caught only by the
  # post-publish smoke-verify (after npm publish). Compile + clippy + test the
  # embed feature once on Linux to catch it pre-merge. Embed unit tests use
  # synthetic-weight seams (blake3 of fake bytes), so NO model download is needed.
  # Linux-only keeps the heavy Candle compile to a single runner.
  embed-check:
    name: Check & Test (ubuntu-latest, with-embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ubuntu-latest-with-embed

      # Same reason as the matrix job above: the 43 ripgrep-backed cli_e2e tests
      # self-skip when `rg` is absent, so this leg ran them as no-ops too.
      - name: Install ripgrep (cli_e2e grep tests self-skip without it)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      # --all-targets matches the no-embed leg (:92): without it the embed
      # feature's test and bench targets are never type-checked here.
      - name: Check
        run: cargo check --features embed-model --all-targets

      - name: Clippy
        run: cargo clippy --features embed-model --all-targets -- -D warnings

      - name: Test
        # CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: the spawned `serve` integration tests
        # would otherwise background-fetch the ~90 MB model on this cache-less
        # runner (slow + flaky as cache population flips which tests skip). Embed
        # UNIT tests use synthetic-weight seams; model-requiring integration tests
        # self-skip without a cached model.
        env:
          CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: '1'
        run: cargo test --features embed-model

  # Plugin/lifecycle/release-smoke tests are Node-based and OS-independent —
  # run once on Linux to avoid the 3× matrix blow-up.
  plugin-tests:
    name: Plugin & Lifecycle Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Plugin lifecycle tests
        # As of M10 this globs ALL *.test.js (see the run: step) minus two
        # documented exclusions, so new test files are never silently skipped.
        # The historical notes below record why each once-curated file is CI-safe
        # and — crucially — why the two excluded files are NOT; keep them.
        # pre-grep-guide.test.js + cg-answer.test.js added in v0.47.0
        # (deny-with-answer); vetted locally — node-only, stub binary via
        # _CG_ANSWER_BINARY, tmpdir fixtures, no cargo build required.
        # covering-tests.test.js added with edit-time covering-test targeting;
        # vetted locally — pure node, no binary/cargo.
        # doctor.test.js + scripts/sync-versions.test.js added in v0.49.1
        # (surveyHookCoverage moved to lifecycle.js); vetted locally — doctor
        # is fixture-only; sync-versions stubs builds via SYNC_VERSIONS_SKIP_BUILD
        # except one test that expects `cargo build` to fail (cargo ships on
        # ubuntu-latest runners).
        # pr-impact-comment.test.js added in v0.53.0; vetted locally — node-only,
        # stub binary via _CG_REVIEW_BINARY shim, tmpdir fixtures, no cargo build.
        #
        # v0.56.2 batch (close the CI/pre-commit coverage gap — most Node tests
        # ran only via the pre-commit hook, invisible to a CI-only contributor).
        # All vetted by READING each test (a local pass is a weak signal because
        # the dev box has target/release/code-graph-mcp, which CI does not):
        #   adopt              — pure logic + mkdtemp sandboxes (memoryDir slug,
        #                        sentinel heal, detectProjectType); no binary/net.
        #   claude-config      — pure CLAUDE_CONFIG_DIR env-var resolution.
        #   find-binary        — fixtures + process.execpath/shell-script fake
        #                        binaries; the one "no platform pkg" test self-
        #                        skips if a real global install is present, and
        #                        asserts null on a clean runner. `npm root -g`
        #                        is local (no network); npm ships with node.
        #   incremental-index  — shouldRun() env logic + a node-only default-OFF
        #                        spawn; two binary-spawn tests do `if (!findBinary())
        #                        return` and skip on CI (no target/release binary).
        #   pre-read-guide     — fanout state machine + tmpdir; answer stub via
        #                        _CG_ANSWER_BINARY, never the real binary.
        #   project-detect     — isProjectRoot/isNonProjectCwd over tmpdir markers.
        #   recommendation-log — JSONL append/rotate in a tmpdir .code-graph/.
        #   tmp-dir            — cgTmpDir() path + mkdir under os.tmpdir().
        #   user-prompt-context— intent/symbol regex + one CODE_GRAPH_QUIET_HOOKS=1
        #                        node-only spawn; reads committed skills/*.md.
        #   version-utils      — readBinaryVersion/isDevMode/getNewestMtime over
        #                        shell-script fakes + tmpdir; no real binary.
        #
        # Still OUT of CI (need a built binary, network, or local install state):
        #   scripts/install-e2e.test.js — several tests need target/release/
        #     code-graph-mcp; gate is pre-commit, which runs it whenever
        #     claude-plugin/ or scripts/ JS is staged (it went stale for 3 months
        #     when neither gate ran it).
        #
        # mcp-launcher.test.js REJOINED the glob (audit 2026-07-24 F2): its old
        # exclusion reason — the dedup test depending on the gitignored repo-root
        # .mcp.json — was fixed when that test became self-contained (own tmpdir
        # fixture; see the test's comment). On a bare checkout the one
        # binary-forwarding test self-skips via hasBuiltBinary(); the stub/dedup
        # tests and static source checks run for real.
        #
        # --test-concurrency=1: run the files serially. cg-answer + find-binary
        # both touch find-binary's on-disk resolution cache / the _CG_ANSWER_BINARY
        # env; under default per-file parallelism that cross-process state races and
        # cg-answer's binary-resolution test flakes intermittently. Serial is
        # deterministic and the suite is fast (~15s).
        run: |
          # Discover EVERY *.test.js under claude-plugin/scripts/ and scripts/,
          # minus the one below that can't run on a bare CI checkout. Discovery
          # (not a hand-maintained allowlist) means a NEW test file is picked up
          # automatically — the old curated list had silently drifted to miss
          # hook-fire / mcp-stub / post-grep-inject / statusline-composite (M10).
          # A new file that genuinely needs a built binary / network fails LOUDLY
          # here; add it to the exclusion grep with a reason rather than dropping
          # back to an allowlist that misses files silently.
          #
          # `find`, not a `*.test.js` shell glob: the glob is NON-RECURSIVE, so
          # the first test file anyone puts in a subdirectory would be skipped in
          # silence — the same M10 failure the allowlist had, re-entering through
          # the mechanism that replaced it. Every test file sits at depth 1 today,
          # which is exactly why this was worth fixing before it wasn't.
          files=$(find claude-plugin/scripts scripts -type f -name '*.test.js' \
            | grep -vE '(^|/)install-e2e\.test\.js$' | sort)
          node --test --test-concurrency=1 $files

  # Supply-chain CVE scan over Cargo.lock (376 transitive deps including the
  # Candle ML stack). cargo-audit reads RustSec advisories and exits non-zero
  # on any vulnerability — keeps CVE coverage continuous instead of a one-time
  # review. Independent of the check-and-test matrix because it scans
  # Cargo.lock content, not build output.
  #
  # Pinned to cargo-audit ^0.22 because 0.21.x panics on RustSec advisories
  # using CVSS 4.0 (e.g. RUSTSEC-2026-0066) — the fetch fails before any
  # finding can be reported.
  #
  # No `--deny warnings`: vulnerabilities fail the run by default; informational
  # advisories (`unmaintained`, `unsound`) print but don't block — most are
  # transitive and not under our control until upstream replacements ship.
  audit:
    name: Cargo Audit (supply-chain CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install --locked --version ^0.22 cargo-audit
      - name: Run cargo audit
        run: cargo audit
