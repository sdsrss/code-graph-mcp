name: Release cache warm

# D#73: every release recompiled all ~397 deps cold on all 5 platforms
# (4–9 min/platform, 21 min worst observed). Two causes compound:
#   1. GitHub Actions cache is REF-scoped — a cache saved by a run on
#      refs/tags/vX is invisible to the next tag's run. Only caches saved on
#      the default branch are readable from every ref.
#   2. No main-branch workflow ever used release.yml's cache key
#      (`key: <target>`), and unused caches are evicted after 7 days
#      (or earlier under the repo's 10 GB LRU).
# Fix: build the exact release matrix ON MAIN so a warm, globally-readable
# cache always exists for release.yml to restore. Runs Mon+Thu (max 4-day
# gap keeps the eviction clock reset), on demand, and when a dep bump lands
# (Cargo.lock push) so the cache tracks the current dependency set.
#
# Every environment-affecting step below MUST mirror release.yml build
# byte-for-byte (toolchain pin, rust-cache pin + key, cross tools, build
# flags) — a drifted toolchain or feature set produces a cache release.yml
# can't use. No artifacts are uploaded; warming is the only product.

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.lock']

permissions:
  contents: read

# Warming is preemptible — a newer run supersedes an in-flight one.
concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  warm:
    name: Warm ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      # Same SHA pin as release.yml (1.95.0) — a different rustc hashes to a
      # different cache namespace and the warm cache would never be restored.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      # `shared-key` mirrors release.yml exactly — rust-cache's automatic key
      # embeds the job name, so plain `key` caches from this `warm` job could
      # never be restored by release.yml's `build` job (proven live on
      # v0.101.0: green priming run, yet all 5 release builds "No cache found").
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-${{ matrix.target }}

      # Bounded for the same reason as the ripgrep step below — this is the other
      # apt call in this repo's CI, and an unbounded `apt-get update` is what ran
      # three workflows into a hand-kill on 2026-08-19. This step is the one that
      # died on the bare 15-minute ceiling on 2026-09-04; its twin in release.yml
      # carries the reasoning for the retry and the 7-minute per-attempt budget,
      # and `the_arm64_cross_compile_install_is_identical_in_both_workflows`
      # pins the two bodies together, so edit them as a pair.
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 24
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 420 apt-get update && \
               sudo timeout 420 apt-get install -y gcc-aarch64-linux-gnu; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::apt did not deliver the aarch64 toolchain in 3 attempts of 7 minutes"
              exit 1
            fi
            # A kill mid-unpack can leave dpkg half-configured; the next attempt
            # would then fail on that rather than on the mirror, which is a
            # confusing second failure with a different cause.
            sudo dpkg --configure -a || true
            echo "::warning::apt attempt $attempt did not finish in 7 minutes; retrying against a fresh mirror draw"
            sleep 15
          done
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      # Same flags as the release build so the cached dep artifacts are the
      # ones release.yml actually links against.
      - name: Build (warm dependency cache)
        run: cargo build --locked --release --features embed-model --target ${{ matrix.target }}

  # Primes release.yml's `gate` job (audit 2026-07-27 P1-3), which is the only
  # thing standing between a tag push and an irreversible npm publish. Same
  # ref-scoping problem as `warm` above: gate runs on refs/tags/vX and can only
  # restore a cache written on the default branch, so gate is restore-only
  # (`save-if: false`) and this job is the sole writer of `release-gate`.
  #
  # Distinct from `warm`: gate compiles the DEV profile with --all-targets (test
  # binaries, clippy metadata), a different artifact set from `warm`'s
  # `--release` host build, so it needs its own cache entry rather than sharing
  # release-x86_64-unknown-linux-gnu.
  #
  # Commands mirror gate byte-for-byte, `-D warnings` included: the lint flags
  # participate in cargo's fingerprint, so a "cheaper" variant here would warm a
  # cache gate then misses. The consequence is that a lint-red or test-red main
  # turns this job red — a true signal, since the next tag's gate would fail the
  # same way. `cache-on-failure` is set because of that: it defaults to FALSE, so
  # without it a single failing lint on main would also mean no cache was saved,
  # and the warming would stay dark for as long as main stayed red — precisely
  # when a release is most likely to need re-running.
  warm-gate:
    name: Warm release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt, clippy

      # shared-key must stay identical to release.yml's gate step.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-gate
          cache-on-failure: true

      # Mirrors release.yml `gate`: the 43 ripgrep-backed tests in
      # tests/cli_e2e.rs self-skip when `rg` is missing. Without this the warm
      # job would run a strictly weaker test set than the gate it primes, so a
      # grep regression on main would stay green here and only surface on the
      # tag. Runtime-only (rg is spawned, not linked), so it does not affect the
      # cached artifacts.
      # Bounded and retried for the same reason as the gate it mirrors: on
      # 2026-08-19 this workflow, ci.yml and release.yml all stalled on the same
      # apt mirror at the same time. Three copies, one failure.
      - name: Install ripgrep (cli_e2e grep tests self-skip without it)
        timeout-minutes: 8
        run: |
          if command -v rg >/dev/null 2>&1; then rg --version; exit 0; fi
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y ripgrep; then
              rg --version
              exit 0
            fi
            echo "::warning::ripgrep install attempt ${attempt} failed or timed out; retrying"
            sleep 5
          done
          echo "::error::apt could not install ripgrep after 3 attempts"
          exit 1

      - name: Clippy (no default features)
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings

      - name: Clippy (embed-model)
        run: cargo clippy --locked --features embed-model --all-targets -- -D warnings

      - name: Test (no default features)
        # Mirrors release.yml gate's new no-default test leg (audit 2026-08-16
        # P1-18): the warm must run the same commands as the gate it primes, or
        # the gate pays a cold compile for the no-default test/bin targets on
        # every tag. Same cheap-first ordering as the gate.
        run: cargo test --locked --no-default-features

      - name: Test (embed-model)
        # Mirrors ci.yml's embed-check job: without this the spawned `serve`
        # integration tests background-fetch the ~90 MB model on a runner whose
        # cache does not carry it — slow, and flaky because cache population
        # flips which tests self-skip. This job is now the last gate before an
        # irreversible npm publish, so it must not be the flakiest one.
        env:
          CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: '1'
        run: cargo test --locked --features embed-model

      - name: Real-weight backfill regressions
        # The THOROUGH half of the real-weight coverage (audit 2026-09-05
        # ENG-02). These two observe embedding backfill end to end — they are the
        # ones that caught "vectors stranded at 2%" and "stuck at 99%" — and the
        # step above cannot run them: it sets CODE_GRAPH_DISABLE_MODEL_DOWNLOAD=1
        # on a runner with no cached model, so both self-skip and report green
        # having executed nothing. CODE_GRAPH_REQUIRE_MODEL=1 makes that skip a
        # failure; the weights come from the same sha256-pinned `model-assets-v1`
        # mirror release.yml uses, so nothing is downloaded here at all. Naming
        # HuggingFace would name the wrong risk — the auto-download targets this
        # repo's own release, not HF. What holds it shut is `spawn_model_download`
        # returning early once a model is loaded and DISABLE_MODEL_DOWNLOAD
        # short-circuiting before any thread spawns (mcp/server/mod.rs:1280-1300).
        #
        # They live HERE, on a cron, and not in release.yml's gate, because they
        # fail intermittently for a reason nobody has found: 2 runs in 6 against
        # real weights, both `0 vectors after 300 s` from the startup test, which
        # passes in 51 s alone. Not slowness — EMBED_POLL_BUDGET is per test and
        # each finished well inside it even pinned to 2 cores; the weights and an
        # unread stderr pipe were measured and ruled out too. An unexplained
        # 2-in-6 in front of an irreversible npm publish is a coin flip that
        # blocks every release; here a red run is a finding (pre-ship review
        # 2026-09-06). Expect reds until the defect is found — that visibility is
        # the point. The gate keeps the cheap check —
        # `test_embed_produces_correct_dims`, 1.36 s — so "the weights we are
        # about to publish load and embed" is still answered BEFORE publish.
        #
        # `timeout-minutes` bounds the whole step: two per-test 300 s poll budgets
        # plus a download, with room for a slow runner, and no risk of a wedged
        # embed loop holding the cron open.
        timeout-minutes: 25
        env:
          CODE_GRAPH_DISABLE_MODEL_DOWNLOAD: '1'
          CODE_GRAPH_REQUIRE_MODEL: '1'
        run: |
          mkdir -p warm-models
          MODEL_BASE="https://github.com/${{ github.repository }}/releases/download/model-assets-v1"
          for f in model.safetensors tokenizer.json config.json; do
            # --max-time: curl has no default transfer timeout and --retry does
            # not fire on a connected-but-stalled transfer.
            curl -L --fail --retry 3 --retry-delay 2 --max-time 300 -o warm-models/$f \
              "$MODEL_BASE/$f"
          done
          # Same three pins as release.yml's two copies; kept in step by
          # tests/hardening.rs::release_model_pins_agree_across_jobs.
          sha256sum -c - <<'PINS'
          53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db  warm-models/model.safetensors
          be50c3628f2bf5bb5e3a7f17b1f74611b2561a3a27eeab05e5aa30f411572037  warm-models/tokenizer.json
          953f9c0d463486b10a6871cc2fd59f223b2c70184f49815e7efbcab5d8908b41  warm-models/config.json
          PINS
          export CODE_GRAPH_MODEL_DIR="$PWD/warm-models"
          # `--exact` + a count assertion: `cargo test <substring>` exits 0 on
          # ZERO matches, so a rename would silently restore "green, having run
          # nothing". Names are pinned to the source by
          # tests/hardening.rs::release_gate_runs_the_real_weight_tests_by_name.
          cargo test --locked --features embed-model --test mcp_stdio_integration -- \
            --exact mcp_startup_embeds_without_any_tool_call \
            mcp_periodic_backfill_embeds_out_of_band_nodes \
            --test-threads=1 > warm-embed.log 2>&1 || { cat warm-embed.log; exit 1; }
          cat warm-embed.log
          grep -qE '^test result: ok\. 2 passed' warm-embed.log || {
            echo "::error::the real-weight backfill regressions did not both run — see the log above"
            exit 1
          }
